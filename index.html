<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>360° Coach – KICKR Kurztest v3</title>
  <style>
    *{box-sizing:border-box} body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1220;color:#fff;margin:0;padding:18px}
    .wrap{max-width:760px;margin:auto} h1{margin:0 0 4px;font-size:28px}.sub,.muted{color:#9aa7bd}.sub{margin-bottom:18px}
    .card{background:#151e2e;border-radius:16px;padding:18px;margin-bottom:14px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .metric{text-align:center;background:#1d283a;border-radius:12px;padding:16px 4px}.value{font-size:30px;font-weight:700}.label{color:#9aa7bd;font-size:12px;margin-top:3px}
    button{width:100%;border:0;border-radius:12px;padding:14px;margin:5px 0;font-size:16px;font-weight:650}.primary{background:#fff;color:#0b1220}.secondary{background:#27354b;color:#fff}.skip{background:#38577e;color:#fff}.danger{background:#55252c;color:#fff}button:disabled{opacity:.4}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.big{font-size:34px;font-weight:750}.pill{display:inline-block;background:#27354b;border-radius:999px;padding:5px 9px;margin-right:6px;font-size:12px}
    #log{background:#070c14;padding:12px;border-radius:10px;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;min-height:120px;max-height:260px;overflow:auto}
  </style>
</head>
<body>
<div class="wrap">
  <h1>360° Coach</h1>
  <div class="sub">KICKR FTMS Kurztest v3 · Workout aus workouts/current.json</div>

  <div class="card">
    <div id="status" class="big">Nicht verbunden</div>
    <div id="workoutName" class="muted">Workout wird geladen …</div>
  </div>

  <div class="card metrics">
    <div class="metric"><div id="power" class="value">--</div><div class="label">WATT IST</div></div>
    <div class="metric"><div id="cadence" class="value">--</div><div class="label">RPM</div></div>
    <div class="metric"><div id="speed" class="value">--</div><div class="label">KM/H</div></div>
  </div>

  <div class="card">
    <div class="muted">AKTUELLER SCHRITT</div>
    <div id="stepName" class="big">–</div>
    <div style="margin-top:8px">
      <span id="targetPill" class="pill">Ziel -- W</span>
      <span id="timerPill" class="pill">0:00 / 0:00</span>
      <span id="stepPill" class="pill">Schritt – / –</span>
    </div>
    <div class="muted" style="margin-top:10px">Nächster: <span id="nextStep">–</span></div>
  </div>

  <div class="card">
    <button class="primary" onclick="connectTrainer()">KICKR VERBINDEN</button>
    <button class="secondary" onclick="loadWorkout()">WORKOUT NEU LADEN</button>
    <div class="row">
      <button id="startBtn" class="secondary" onclick="startWorkout()" disabled>START</button>
      <button id="skipBtn" class="skip" onclick="skipStep()" disabled>SKIP ▶</button>
    </div>
    <button class="danger" onclick="disconnectTrainer()">VERBINDUNG TRENNEN</button>
  </div>

  <div class="card"><div class="muted">Debug Log</div><div id="log"></div></div>
</div>

<script>
const FTMS_SERVICE="00001826-0000-1000-8000-00805f9b34fb";
const INDOOR_BIKE_DATA="00002ad2-0000-1000-8000-00805f9b34fb";
const CONTROL_POINT="00002ad9-0000-1000-8000-00805f9b34fb";
const SUPPORTED_POWER_RANGE="00002ad8-0000-1000-8000-00805f9b34fb";

let device=null,server=null,ftms=null,bikeDataCharacteristic=null,controlPointCharacteristic=null;
let workout=null,currentStepIndex=-1,stepStartedAt=null,timerId=null,running=false;

function log(message){const box=document.getElementById('log');const time=new Date().toLocaleTimeString();box.textContent+=`[${time}] ${message}\n`;box.scrollTop=box.scrollHeight;}
function setStatus(text){document.getElementById('status').textContent=text;}
function fmt(sec){sec=Math.max(0,Math.round(sec));return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;}
function trainerReady(){return !!(device&&device.gatt&&device.gatt.connected&&controlPointCharacteristic);}
function updateButtons(){document.getElementById('startBtn').disabled=!(trainerReady()&&workout&&!running);document.getElementById('skipBtn').disabled=!(trainerReady()&&workout&&running);}
function rawError(error){try{return JSON.stringify(error)}catch(e){return String(error)}}

async function loadWorkout(){
  try{
    const url=`workouts/current.json?ts=${Date.now()}`;
    log(`Lade Workout: ${url}`);
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data=await res.json();
    if(!data.steps||!Array.isArray(data.steps)||data.steps.length===0) throw new Error('Keine gültigen steps.');
    workout=data; currentStepIndex=-1; running=false;
    document.getElementById('workoutName').textContent=`${workout.name} · ${workout.steps.length} Schritte`;
    renderStep(); log(`Workout geladen: ${workout.name}`); updateButtons();
  }catch(e){workout=null;document.getElementById('workoutName').textContent='Workout konnte nicht geladen werden.';log(`WORKOUT FEHLER: ${e?.message||rawError(e)}`);updateButtons();}
}

async function connectTrainer(){
  try{
    log('Verbindungsversuch über FTMS-Servicefilter.');
    if(!navigator.bluetooth) throw new Error('Web Bluetooth nicht verfügbar.');
    log('Web Bluetooth API verfügbar.');
    device=await navigator.bluetooth.requestDevice({filters:[{services:[FTMS_SERVICE]}]});
    log(`Gerät ausgewählt: ${device.name||'Unbekannt'}`);
    device.addEventListener('gattserverdisconnected',onDisconnected);
    log('Verbinde GATT …'); server=await device.gatt.connect(); log('GATT verbunden.');
    log('Suche FTMS-Service …'); ftms=await server.getPrimaryService(FTMS_SERVICE); log('FTMS Service gefunden.');
    bikeDataCharacteristic=await ftms.getCharacteristic(INDOOR_BIKE_DATA); log('Indoor Bike Data gefunden.');
    await bikeDataCharacteristic.startNotifications(); bikeDataCharacteristic.addEventListener('characteristicvaluechanged',handleBikeData); log('Indoor Bike Data Notifications aktiv.');
    controlPointCharacteristic=await ftms.getCharacteristic(CONTROL_POINT); log('FTMS Control Point gefunden.');
    try{await controlPointCharacteristic.startNotifications();controlPointCharacteristic.addEventListener('characteristicvaluechanged',handleControlResponse);log('Control Point Notifications aktiv.');}catch(e){log('Control-Point Notifications Hinweis: '+(e?.message||rawError(e)));}
    try{const rangeChar=await ftms.getCharacteristic(SUPPORTED_POWER_RANGE);const range=await rangeChar.readValue();if(range.byteLength>=6){const min=range.getInt16(0,true),max=range.getInt16(2,true),step=range.getUint16(4,true);log(`Supported Power Range: ${min}–${max} W | Schritt ${step} W`);}}catch(e){log('Power Range Hinweis: '+(e?.message||rawError(e)));}
    setStatus(`Verbunden: ${device.name||'KICKR'}`);log('Trainer vollständig verbunden.');await requestControl();updateButtons();
  }catch(error){setStatus('Fehler');log('FEHLER RAW: '+String(error));log('FEHLER JSON: '+rawError(error));if(error?.name)log('Name: '+error.name);if(error?.message)log('Message: '+error.message);updateButtons();}
}

async function requestControl(){if(!controlPointCharacteristic)return;log('Sende FTMS Request Control …');await writeControl(new Uint8Array([0x00]));}
async function setTargetPower(watts){if(!controlPointCharacteristic)throw new Error('Control Point nicht verbunden.');const buffer=new ArrayBuffer(3);const view=new DataView(buffer);view.setUint8(0,0x05);view.setInt16(1,watts,true);log(`Sende Target Power: ${watts} W`);await writeControl(new Uint8Array(buffer));}
async function writeControl(data){if(typeof controlPointCharacteristic.writeValueWithResponse==='function'){await controlPointCharacteristic.writeValueWithResponse(data);}else{await controlPointCharacteristic.writeValue(data);}}

function handleControlResponse(event){const v=event.target.value;const bytes=new Uint8Array(v.buffer,v.byteOffset,v.byteLength);const hex=Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join(' ');log('Control Response: '+hex);if(bytes.length>=3&&bytes[0]===0x80){const opcode=bytes[1],result=bytes[2];const resultText={1:'SUCCESS',2:'OPCODE NOT SUPPORTED',3:'INVALID PARAMETER',4:'OPERATION FAILED',5:'CONTROL NOT PERMITTED'};log(`FTMS Opcode 0x${opcode.toString(16).padStart(2,'0')} → ${resultText[result]||('Code '+result)}`);}}

function handleBikeData(event){
  try{
    const value=event.target.value;let i=0;if(value.byteLength<2)return;const flags=value.getUint16(i,true);i+=2;let speed=null,cadence=null,power=null;
    if((flags&0x0001)===0&&i+2<=value.byteLength){speed=value.getUint16(i,true)/100;i+=2;} if(flags&0x0002)i+=2;
    if(flags&0x0004&&i+2<=value.byteLength){cadence=value.getUint16(i,true)/2;i+=2;} if(flags&0x0008)i+=2;if(flags&0x0010)i+=3;if(flags&0x0020)i+=2;
    if(flags&0x0040&&i+2<=value.byteLength){power=value.getInt16(i,true);i+=2;}
    if(speed!==null)document.getElementById('speed').textContent=speed.toFixed(1);if(cadence!==null)document.getElementById('cadence').textContent=Math.round(cadence);if(power!==null)document.getElementById('power').textContent=power;
  }catch(e){log('DATA PARSE ERROR: '+(e?.message||rawError(e)));}
}

async function startWorkout(){
  if(!trainerReady()||!workout)return;
  try{await requestControl();currentStepIndex=0;running=true;log('Workout gestartet.');await beginCurrentStep();updateButtons();}
  catch(e){log('START FEHLER: '+(e?.message||rawError(e)));running=false;updateButtons();}
}

async function beginCurrentStep(){
  if(!workout||currentStepIndex<0||currentStepIndex>=workout.steps.length){await finishWorkout();return;}
  const step=workout.steps[currentStepIndex];stepStartedAt=Date.now();
  log(`Schritt ${currentStepIndex+1}/${workout.steps.length}: ${step.name} · ${step.durationSec}s · ${step.targetPower}W`);
  await setTargetPower(step.targetPower);renderStep();clearInterval(timerId);timerId=setInterval(tick,250);
}

function tick(){if(!running||!workout||currentStepIndex<0)return;const step=workout.steps[currentStepIndex];const elapsed=(Date.now()-stepStartedAt)/1000;document.getElementById('timerPill').textContent=`${fmt(elapsed)} / ${fmt(step.durationSec)}`;if(elapsed>=step.durationSec)advanceStep('AUTO');}
async function advanceStep(reason){if(!running)return;clearInterval(timerId);log(`${reason}: Schritt ${currentStepIndex+1} beendet.`);currentStepIndex++;if(currentStepIndex>=workout.steps.length){await finishWorkout();}else{await beginCurrentStep();}}
async function skipStep(){if(!running)return;log(`SKIP gedrückt bei Schritt ${currentStepIndex+1}.`);await advanceStep('SKIP');}
async function finishWorkout(){clearInterval(timerId);running=false;currentStepIndex=workout?workout.steps.length:-1;stepStartedAt=null;log('Workout beendet. Setze 100 W Cooldown.');try{await setTargetPower(100);}catch(e){log('Cooldown-Hinweis: '+(e?.message||rawError(e)));}renderStep();updateButtons();}

function renderStep(){
  if(!workout){document.getElementById('stepName').textContent='–';document.getElementById('targetPill').textContent='Ziel -- W';document.getElementById('timerPill').textContent='0:00 / 0:00';document.getElementById('stepPill').textContent='Schritt – / –';document.getElementById('nextStep').textContent='–';return;}
  if(currentStepIndex>=0&&currentStepIndex<workout.steps.length){const s=workout.steps[currentStepIndex];document.getElementById('stepName').textContent=s.name;document.getElementById('targetPill').textContent=`Ziel ${s.targetPower} W`;document.getElementById('timerPill').textContent=`0:00 / ${fmt(s.durationSec)}`;document.getElementById('stepPill').textContent=`Schritt ${currentStepIndex+1} / ${workout.steps.length}`;const n=workout.steps[currentStepIndex+1];document.getElementById('nextStep').textContent=n?`${n.name} · ${n.durationSec}s @ ${n.targetPower} W`:'Workout-Ende';}
  else if(currentStepIndex>=workout.steps.length){document.getElementById('stepName').textContent='Fertig';document.getElementById('targetPill').textContent='Cooldown 100 W';document.getElementById('timerPill').textContent='–';document.getElementById('stepPill').textContent=`${workout.steps.length} / ${workout.steps.length}`;document.getElementById('nextStep').textContent='–';}
  else{document.getElementById('stepName').textContent='Bereit';document.getElementById('targetPill').textContent='Ziel -- W';document.getElementById('timerPill').textContent='0:00 / 0:00';document.getElementById('stepPill').textContent=`0 / ${workout.steps.length}`;const n=workout.steps[0];document.getElementById('nextStep').textContent=n?`${n.name} · ${n.durationSec}s @ ${n.targetPower} W`:'–';}
}

function disconnectTrainer(){clearInterval(timerId);running=false;if(device?.gatt?.connected)device.gatt.disconnect();onDisconnected();}
function onDisconnected(){setStatus('Nicht verbunden');document.getElementById('power').textContent='--';document.getElementById('cadence').textContent='--';document.getElementById('speed').textContent='--';log('Bluetooth-Verbindung getrennt.');updateButtons();}

log('360° Coach FTMS Tester v3 geladen.');
if('bluetooth' in navigator)log('Web Bluetooth erkannt.');else log('Web Bluetooth NICHT erkannt.');
loadWorkout();
</script>
</body>
</html>
